
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đánh giá cảnh báo sớm NEWS2</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  margin: 0;
  padding: 20px;
  color: #263445;
}

.news-container {
  max-width: 950px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}

h2 {
  text-align: center;
  color: #1769aa;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.logo-wrap {
  width: 120px;
  height: 120px;
  background: white;
  border-radius: 50%;
  margin: auto auto 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  box-shadow: 0 4px 12px #0002;
  overflow: hidden;
}

.logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.section {
  margin-bottom: 18px;
  border: 1px solid #e1e6ed;
  border-radius: 8px;
  overflow: hidden;
}

.section-title {
  background: #edf4fa;
  padding: 13px;
  font-weight: bold;
}

.section-body {
  padding: 14px;
}

.option-group {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 9px;
}

.option-btn {
  border: 2px solid #dce3eb;
  background: #fff;
  color: #263445;
  padding: 13px 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  min-height: 60px;
  transition: .15s;
}

.option-btn .point {
  display: block;
  font-size: 13px;
  margin-top: 6px;
  font-weight: bold;
}

/* Màu chữ theo mức điểm */
.option-btn.s0 .point { color: #23834a; }
.option-btn.s1 .point { color: #b18a00; }
.option-btn.s2 .point { color: #e07800; }
.option-btn.s3 .point { color: #c62828; }

/* Chỉ đổi màu nút khi được chọn */
.option-btn.selected {
  border-color: #1769aa;
  background: #1769aa;
  color: white;
}

.option-btn.selected .point {
  color: white;
}

.option-btn:hover:not(.selected) {
  border-color: #1769aa;
  background: #f5f9ff;
}

/* Bỏ màu nền theo điểm khi chọn */
.s0.selected,
.s1.selected,
.s2.selected,
.s3.selected {
  background: #1769aa;
  border-color: #1769aa;
  color: white;
}
.copd-group {
  display: flex;
  gap: 10px;
}

.copd-group button {
  flex: 1;
  padding: 13px;
  border: 2px solid #dce3eb;
  background: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.copd-group button.active {
  background: #1769aa;
  color: white;
  border-color: #1769aa;
}

.result {
  margin-top: 25px;
  padding: 20px;
  background: #f7f9fc;
  border-radius: 10px;
  text-align: center;
}

.total {
  font-size: 52px;
  font-weight: bold;
  color: #1769aa;
}

.status {
  font-size: 18px;
  font-weight: bold;
  margin: 12px;
}

.detail {
  margin-top: 15px;
  text-align: left;
}

.score-row {
  display: flex;
  justify-content: space-between;
  padding: 9px;
  border-bottom: 1px solid #ddd;
}

.score {
  font-weight: bold;
  min-width: 30px;
  text-align: center;
}

.s0 { background: #e5f4e9; }
.s1 { background: #fff3a6; }
.s2 { background: #ffbd69; }
.s3 { background: #ef7777; color: white; }

.warning {
  padding: 12px;
  border-radius: 6px;
  margin-top: 12px;
  background: #fff3cd;
  color: #795600;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.action-btn {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.home { background: #23834a; color: white; }
.reset { background: #e1e6ed; }
.print { background: #1769aa; color: white; }

button:focus-visible {
  outline: 3px solid #8bbcff;
  outline-offset: 2px;
}

@media(max-width:600px) {
  body { padding: 8px; }
  .news-container { padding: 14px; }
  .option-group { grid-template-columns: repeat(2, 1fr); }
  .buttons { flex-wrap: wrap; }
  .action-btn { min-width: 28%; }
}

@media print {
  body { background: white; padding: 0; }
  .news-container { box-shadow: none; }
  .buttons { display: none; }
  .option-btn:not(.selected) { display: none; }
}
</style>
</head>

<body>
<div class="news-container">

<section class="hero">
  <div class="logo-wrap">
    <img src="./logo-bv-new.png" alt="Logo">
  </div>

  <h2>THANG ĐIỂM CẢNH BÁO SỚM NEWS2</h2>
  <div class="subtitle">Đánh giá tình trạng người bệnh</div>
</section>

<div class="section">
  <div class="section-title">Phân loại hô hấp</div>
  <div class="section-body">
    <div class="copd-group">
      <button id="copd1" class="active" onclick="setCOPD(1)">
        Không COPD<br>Thang 1
      </button>
      <button id="copd2" onclick="setCOPD(2)">
        Có COPD<br>Thang 2
      </button>
    </div>
  </div>
</div>

<div id="fields"></div>

<div class="result">
  <div>TỔNG ĐIỂM NEWS2</div>
  <div class="total" id="total">0</div>
  <div class="status" id="status">Chưa đánh giá</div>
  <div id="count">Đã chọn 0/7 thông số</div>
  <div class="detail" id="detail"></div>
  <div id="warning"></div>
</div>

<div class="buttons">
  <button class="action-btn home" onclick="goHome()">⌂ Home</button>
  <button class="action-btn reset" onclick="resetForm()">Làm mới</button>
  <button class="action-btn print" onclick="window.print()">In kết quả</button>
</div>

<p style="font-size:12px;color:#777;margin-top:20px">
NEWS2 là công cụ hỗ trợ đánh giá và phát hiện sớm tình trạng
người bệnh diễn biến xấu. Không thay thế đánh giá lâm sàng.
</p>

</div>

<script>
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw2B0cnUDuw-CzM68Q3DtaEX_K2XE3OqMRzUNOhyov08l1MPtcSSgy7MM4YNoJYqYcRrQ/exec";

let recorded = false;
let copd = 1;
let answers = {};

function recordToSheet(total) {

  const p = new URLSearchParams({
    action: "record",
    copd: copd === 1 ? "Không COPD" : "COPD",
    total: total,

    rr: answers.rr.score,
    spo2: answers.spo2.score,
    oxygen: answers.oxygen.score,
    bp: answers.bp.score,
    pulse: answers.pulse.score,
    conscious: answers.conscious.score,
    temp: answers.temp.score
  });

  fetch(GOOGLE_SCRIPT_URL + "?" + p.toString(), {
    method: "GET",
    mode: "no-cors",
    cache: "no-store"
  }).catch(error => {
    console.error("Lỗi gửi dữ liệu NEWS2:", error);
  });
}

const parameters = [
{
 id:"rr",
 title:"1. Nhịp thở (lần/phút)",
 options:[
  ["≤ 8",3],["9 - 11",1],
  ["12 - 20",0],["21 - 24",2],["≥ 25",3]
 ]
},
{
 id:"spo2",
 title:"2. SpO₂ (%)",
 options:[]
},
{
 id:"oxygen",
 title:"3. Thở oxy",
 options:[
  ["Không",0],["Có",2]
 ]
},
{
 id:"bp",
 title:"4. Huyết áp tâm thu (mmHg)",
 options:[
  ["≤ 90",3],["91 - 100",2],
  ["101 - 110",1],["111 - 219",0],["≥ 220",3]
 ]
},
{
 id:"pulse",
 title:"5. Mạch (lần/phút)",
 options:[
  ["≤ 40",3],["41 - 50",1],
  ["51 - 90",0],["91 - 110",1],
  ["111 - 130",2],["≥ 131",3]
 ]
},
{
 id:"conscious",
 title:"6. Ý thức",
 options:[
  ["Tỉnh táo (A)",0],
  ["Không tỉnh táo (C,V,P,U)",3]
 ]
},
{
 id:"temp",
 title:"7. Nhiệt độ (°C)",
 options:[
  ["≤ 35.0",3],["35.1 - 36.0",1],
  ["36.1 - 38.0",0],
  ["38.1 - 39.0",1],["≥ 39.1",2]
 ]
}
];

const scale1 = [
 ["≤ 91",3],["92 - 93",2],
 ["94 - 95",1],["≥ 96",0]
];

const scale2 = [
 ["≤ 83",3],["84 - 85",2],
 ["86 - 87",1],["88 - 92",0],
 ["≥ 93 (khí trời)",0],
 ["93 - 94 (thở oxy)",1],
 ["95 - 96 (thở oxy)",2],
 ["≥ 97 (thở oxy)",3]
];

function setCOPD(value) {
 recorded = false;
 copd = value;

 document.getElementById("copd1").classList.toggle("active", value === 1);
 document.getElementById("copd2").classList.toggle("active", value === 2);

 delete answers.spo2;
 renderFields();
 calculate();
}

function renderFields() {
 const container = document.getElementById("fields");
 container.innerHTML = "";

 parameters.forEach(p => {
  const options = p.id === "spo2"
   ? (copd === 1 ? scale1 : scale2)
   : p.options;

  const section = document.createElement("div");
  section.className = "section";

  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = p.title;

  const body = document.createElement("div");
  body.className = "section-body";

  const group = document.createElement("div");
  group.className = "option-group";

  options.forEach(([label, score], index) => {
   const button = document.createElement("button");
   button.type = "button";
   button.className = "option-btn s" + score;

   button.innerHTML = `
    ${label}
    <span class="point">Điểm ${score}</span>
   `;

   if (answers[p.id]?.index === index) {
    button.classList.add("selected");
   }

   button.addEventListener("click", () => {
    answers[p.id] = {
     index: index,
     score: score,
     label: label
    };

    group.querySelectorAll("button").forEach(b =>
     b.classList.remove("selected")
    );

    button.classList.add("selected");
    calculate();
   });

   group.appendChild(button);
  });

  body.appendChild(group);
  section.appendChild(title);
  section.appendChild(body);
  container.appendChild(section);
 });
}

function calculate() {
 let total = 0;
 let selected = 0;
 let highest = 0;
 let details = "";

 parameters.forEach(p => {
  const answer = answers[p.id];

  if (!answer) return;

  const score = answer.score;

  total += score;
  selected++;
  highest = Math.max(highest, score);

  details += `
   <div class="score-row s${score}">
    <span>${p.title}: ${answer.label}</span>
    <span class="score">${score}</span>
   </div>
  `;
 });

 document.getElementById("total").textContent = total;

 document.getElementById("count").textContent =
  `Đã chọn ${selected}/7 thông số`;

 document.getElementById("detail").innerHTML = details;

 let status = "Chưa đánh giá";
 let color = "#1769aa";
 let warning = "";

 if (selected === 7) {
  if (total >= 7) {
   status = "NGUY CƠ CAO";
   color = "#c62828";
  } else if (total >= 5) {
   status = "NGUY CƠ TRUNG BÌNH";
   color = "#e07800";
  } else if (total >= 1) {
   status = "NGUY CƠ THẤP";
   color = "#b18a00";
  } else {
   status = "NGUY CƠ THẤP";
   color = "#23834a";
  }

  if (highest === 3) {
   warning = "CẢNH BÁO: Có ít nhất một thông số đạt 3 điểm. Cần đánh giá và xử trí khẩn theo quy trình.";
  }

  if (total >= 5) {
   warning = "CẢNH BÁO: NEWS2 từ 5 điểm trở lên. Cần đánh giá lâm sàng khẩn và kích hoạt quy trình đáp ứng phù hợp.";
  }
 } else {
  status = "CHƯA ĐỦ THÔNG SỐ";
  warning = "Vui lòng đánh giá đầy đủ 7 thông số.";
 }

 document.getElementById("status").textContent = status;
 document.getElementById("status").style.color = color;

 document.getElementById("warning").innerHTML =
  warning ? `<div class="warning">${warning}</div>` : "";
  if (selected === 7 && !recorded) {
  recorded = true;
  recordToSheet(total);
}
}

function resetForm() {
 recorded = false;
 copd = 1;
 answers = {};

 document.getElementById("copd1").classList.add("active");
 document.getElementById("copd2").classList.remove("active");

 renderFields();
 calculate();
}

function goHome() {
 window.location.href = "/";
}

renderFields();
calculate();
</script>
</body>
</html>
