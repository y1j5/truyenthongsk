<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>
    Thông tin bệnh
  </title>

  <meta
    name="description"
    content=""
    id="meta-desc"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#222;
      line-height:1.7;
    }

    
    .badge{
      display:inline-block;

      background:rgba(255,255,255,0.2);

      padding:6px 14px;

      border-radius:30px;

      margin-bottom:16px;

      font-size:14px;
    }


    .container{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;

      border-radius:16px;

      padding:28px;

      margin-bottom:24px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.06);
    }

    .card h2{
      margin-bottom:18px;
      color:#c62828;
    }

    .grid{
      display:grid;

      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

      gap:16px;
    }

    .symptom{
      background:#fff5f5;

      border-left:5px solid #e53935;

      padding:16px;

      border-radius:10px;
    }

    .steps{
      counter-reset:step;
    }

    .step{
      position:relative;
      padding-left:60px;
      margin-bottom:24px;
    }

    .step::before{

      counter-increment:step;

      content:counter(step);

      position:absolute;

      left:0;
      top:0;

      width:40px;
      height:40px;

      border-radius:50%;

      background:#d32f2f;

      color:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-weight:bold;
    }

    .warning{
      background:#fff3cd;

      border:1px solid #ffe082;

      padding:18px;

      border-radius:12px;

      margin-top:18px;
    }

    ul{
      padding-left:20px;
    }

    li{
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      padding:30px 20px;
      color:#666;
      font-size:14px;
    }

    .cta{
      margin-top:24px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;

      padding:12px 18px;

      border-radius:10px;

      font-weight:bold;
    }

    .btn-primary{
      background:#d32f2f;
      color:white;
    }

    .btn-secondary{
      background:white;

      color:#d32f2f;

      border:2px solid #d32f2f;
    }

    .info-box{
      background:#f0f7ff;

      border-left:5px solid #1976d2;

      padding:18px;

      border-radius:10px;

      margin-top:18px;
    }

.hospital-item{
  background:#f7fbff;
  border:1px solid #dbeafe;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}

.hospital-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.hospital-level{
  background:#d32f2f;
  color:#fff;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

.hospital-time{
  background:#eef2ff;
  color:#3949ab;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
}

.hospital-text{
  margin-bottom:14px;
}

.exam-tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.exam-tags span{
  background:#fff;
  border:1px solid #d6d6d6;
  padding:8px 12px;
  border-radius:999px;
  font-size:14px;
}

.guide-source{
  margin-top:20px;
  font-size:14px;
  color:#666;
}
    .header-image img{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
}
/* =========================
   HERO FIX CLEAN VERSION
========================= */

.hero{
    position:relative;
    overflow:hidden;

    padding:70px 24px 90px;

    background:linear-gradient(
        135deg,
        var(--color1),
        var(--color2)
    );

    color:#fff;
}

/* force text trắng */
.hero *{
    color:inherit;
}

/* layout */
.hero-content{
    max-width:1180px;
    margin:auto;

    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:60px;
}

/* LEFT */
.hero-left{
    position:relative;
    z-index:3;
}

.hero-left h1{
    font-size:58px;
    line-height:1.05;
    font-weight:800;

    margin:18px 0 22px;
}

.hero-left p{
    max-width:560px;

    font-size:18px;
    line-height:1.8;

    color:rgba(255,255,255,0.92);

    margin-bottom:34px;
}

/* badge */
.badge{
    display:inline-flex;
    align-items:center;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(255,255,255,0.14);

    backdrop-filter:blur(12px);

    font-size:14px;
    font-weight:600;

    margin-bottom:10px;
}

/* CTA */
.cta{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 24px;

    border-radius:14px;

    text-decoration:none;
    font-weight:700;

    transition:0.3s ease;
}

.btn-primary{
    background:#fff !important;
    color:var(--color1) !important;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-secondary{
    background:transparent;

    border:2px solid rgba(255,255,255,0.35);

    color:#fff !important;
}

.btn-secondary:hover{
    background:rgba(255,255,255,0.1);
}

/* RIGHT */
.hero-right{
    position:relative;

    display:flex;
    justify-content:center;
}

/* IMAGE */
.header-image{
    position:relative;

    width:100%;
    max-width:620px;

    border-radius:32px;
    overflow:hidden;

    box-shadow:
        0 24px 70px rgba(0,0,0,0.22);
}

.header-image img{
    width:100%;
    height:430px;

    object-fit:cover;
    display:block;
}

/* overlay */
.header-image::after{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.05)
    );
}

/* LOGO FLOAT */
.logo-wrap{
    position:absolute;

    right:-18px;
    bottom:-28px;

    width:110px;
    height:110px;

    border-radius:50%;

    background:rgba(255,255,255,0.96);

    padding:14px;

    border:5px solid rgba(255,255,255,0.65);

    backdrop-filter:blur(12px);

    box-shadow:
        0 14px 35px rgba(0,0,0,0.25);

    z-index:5;
}

.logo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* glow */
.hero::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-220px;
    left:-120px;

    filter:blur(10px);
}

/* MOBILE */
@media(max-width:992px){

    .hero{
        padding:50px 20px 80px;
    }

    .hero-content{
        grid-template-columns:1fr;
        gap:42px;
    }

    .hero-left{
        text-align:center;
    }

    .hero-left h1{
        font-size:42px;
    }

    .hero-left p{
        margin-left:auto;
        margin-right:auto;
        font-size:16px;
    }

    .cta{
        justify-content:center;
    }

    .header-image{
        max-width:100%;
    }

    .header-image img{
        height:260px;
    }

    .logo-wrap{
        width:82px;
        height:82px;

        right:14px;
        bottom:-18px;
    }

}
  </style>

</head>

<body>

  <div id="app"></div>

  <footer>
    © 2026 - Thông tin sức khỏe cộng đồng
  </footer>

  <script src="./data.js?v=3"></script>
<script src="./item.js?v=3"></script>
  <script>

    const params =
      new URLSearchParams(window.location.search);

    const id =
      params.get("id");

    const disease =
      diseases.find(
        x => x.id === id
      );

    if(!disease){

      document
        .getElementById("app")
        .innerHTML = `

          <div class="container">

            <div class="card">

              <h1>
                Không tìm thấy dữ liệu
              </h1>

            </div>

          </div>

        `;

      throw new Error(
        "Disease not found"
      );
    }

    document.title =
      disease.seoTitle;

    document
      .getElementById("meta-desc")
      .setAttribute(
        "content",
        disease.seoDescription
      );

    document
      .getElementById("app")
      .innerHTML = `

      <section
        class="hero"
        style="
          background:
          linear-gradient(
            135deg,
            ${disease.hero.color1},
            ${disease.hero.color2}
          );
        "
      >

    <div class="hero-content">

    <!-- LEFT -->
    <div class="hero-left">

        <div class="badge">
            ${disease.hero.badge}
        </div>

        <h1>
            ${disease.title}
        </h1>

        <p>
            ${disease.hero.desc}
        </p>

        <div class="cta">

            <a
                href="#nhan-biet"
                class="btn btn-primary"
            >
                Nhận biết nhanh
            </a>

            <a
                href="#xu-tri"
                class="btn btn-secondary"
            >
                Xử trí cấp cứu
            </a>

        </div>

    </div>

    <!-- RIGHT -->
    <div class="hero-right">

        <div class="header-image">

            <img
                src="./header.jpg"
                alt="Header"
            >

        </div>

        <div class="logo-wrap">

            <img
                src="./logo-bv-new.png"
                alt="Logo"
            >

        </div>

    </div>

</div>

      <div class="container">

        <div class="card">

          <h2>

            ${disease.overview.title}

          </h2>

          <p>

            ${disease.overview.content}

          </p>

          <div class="info-box">

            ${disease.overview.info}

          </div>

        </div>

        <div
          class="card"
          id="nhan-biet"
        >

          <h2>

            ${disease.symptoms.title}

          </h2>

          <div class="grid">

            ${disease.symptoms.items.map(item => `

              <div class="symptom">

                <h3>
                  ${item.title}
                </h3>

                <p>
                  ${item.desc}
                </p>

              </div>

            `).join("")}

          </div>

          <div class="warning">

            <strong>
              Lưu ý:
            </strong>

            ${disease.symptoms.warning}

          </div>

        </div>

        <div
          class="card"
          id="xu-tri"
        >

          <h2>

            ${disease.emergency.title}

          </h2>

          <div class="steps">

            ${disease.emergency.items.map(item => `

              <div class="step">

                <h3>
                  ${item.title}
                </h3>

                <p>
                  ${item.desc}
                </p>

              </div>

            `).join("")}

          </div>

        </div>

        <div class="card">

          <h2>

            ${disease.risks.title}

          </h2>

          <ul>

            ${disease.risks.items.map(item => `

              <li>${item}</li>

            `).join("")}

          </ul>

        </div>
<div class="card">

  <h2>
    ${disease.hospitalSuggestion.title}
  </h2>

  ${disease.hospitalSuggestion.items.map(item => `

    <div class="hospital-item">

      <div class="hospital-top">

        <span class="hospital-level">
          ${item.level}
        </span>

        <span class="hospital-time">
          ${item.time}
        </span>

      </div>

      <p class="hospital-text">
        ${item.text}
      </p>

      <div class="exam-tags">

        ${item.exam.map(exam => `
          <span>${exam}</span>
        `).join("")}

      </div>

    </div>

  `).join("")}

  <div class="guide-source">

    <strong>Nguồn tham khảo:</strong>

    ${disease.hospitalSuggestion.guidelineSource.join(", ")}

  </div>

</div>
       

  

    `;

  </script>

</body>
</html>
