<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  
  <title>
    Thông tin bệnh
  </title>
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
  rel="stylesheet"
>
  <meta
    name="description"
    content=""
    id="meta-desc"
  />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#222;
      line-height:1.7;
    }

    
    .badge{
      display:inline-block;

      background:rgba(255,255,255,0.2);

      padding:6px 14px;

      border-radius:30px;

      margin-bottom:16px;

      font-size:14px;
    }


    .container{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;

      border-radius:16px;

      padding:28px;

      margin-bottom:24px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.06);
    }

    .card h2{
      margin-bottom:18px;
      color:#c62828;
    }

    .grid{
      display:grid;

      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

      gap:16px;
    }

    .symptom{
      background:#fff5f5;

      border-left:5px solid #e53935;

      padding:16px;

      border-radius:10px;
    }

    .steps{
      counter-reset:step;
    }

    .step{
      position:relative;
      padding-left:60px;
      margin-bottom:24px;
    }

    .step::before{

      counter-increment:step;

      content:counter(step);

      position:absolute;

      left:0;
      top:0;

      width:40px;
      height:40px;

      border-radius:50%;

      background:#d32f2f;

      color:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-weight:bold;
    }

    .warning{
      background:#fff3cd;

      border:1px solid #ffe082;

      padding:18px;

      border-radius:12px;

      margin-top:18px;
    }

    ul{
      padding-left:20px;
    }

    li{
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      padding:30px 20px;
      color:#666;
      font-size:14px;
    }

    .cta{
      margin-top:24px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;

      padding:12px 18px;

      border-radius:10px;

      font-weight:bold;
    }

    .btn-primary{
      background:#d32f2f;
      color:white;
    }

    .btn-secondary{
      background:white;

      color:#d32f2f;

      border:2px solid #d32f2f;
    }

    .info-box{
      background:#f0f7ff;

      border-left:5px solid #1976d2;

      padding:18px;

      border-radius:10px;

      margin-top:18px;
    }

.hospital-item{
  background:#f7fbff;
  border:1px solid #dbeafe;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}

.hospital-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.hospital-level{
  background:#d32f2f;
  color:#fff;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

.hospital-time{
  background:#eef2ff;
  color:#3949ab;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
}

.hospital-text{
  margin-bottom:14px;
}

.exam-tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.exam-tags span{
  background:#fff;
  border:1px solid #d6d6d6;
  padding:8px 12px;
  border-radius:999px;
  font-size:14px;
}

.guide-source{
  margin-top:20px;
  font-size:14px;
  color:#666;
}
.header-image{
    position:relative;

    width:100%;
    max-width:620px;

    height:430px;

    border-radius:32px;
    overflow:hidden;

    box-shadow:
        0 24px 70px rgba(0,0,0,0.22);
}

.header-image img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;

    transform:scale(1.04);
}
/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;

    padding:70px 24px 90px;

    background:linear-gradient(
        135deg,
        var(--color1),
        var(--color2)
    );
}

/* KHÔNG dùng hero * */

.hero-content{
    max-width:1180px;
    margin:auto;

    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:60px;
}

.hero-left{
    position:relative;
    z-index:3;
}

.hero-left {
    font-size:18px;
    line-height:1.05;
    font-weight:800;

    margin:18px 0 22px;

    color:#fff;
}

.hero-left p{
    max-width:560px;

    font-size:18px;
    line-height:1.8;

    color:rgba(255,255,255,0.92);

    margin-bottom:34px;
}
/* TITLE FONT */
.hero-left h1{
    font-family:
        "Poppins",
        "Montserrat",
        Arial,
        sans-serif;

    font-size:20px;

    font-weight:800;

    line-height:1.05;

    letter-spacing:-1px;

    color:#fff;

    margin:18px 0 22px;

    text-shadow:
        0 4px 18px rgba(0,0,0,0.18);
}
.badge{
    display:inline-flex;
    align-items:center;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(255,255,255,0.14);

    backdrop-filter:blur(12px);

    font-size:14px;
    font-weight:600;

    margin-bottom:10px;

    color:#fff;
}

.cta{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 24px;

    border-radius:14px;

    text-decoration:none;
    font-weight:700;

    transition:0.3s ease;

    display:inline-block;
}

.btn-primary{
    background:#fff;
    color:#c62828;
}

.btn-secondary{
    background:transparent;

    border:2px solid rgba(255,255,255,0.35);

    color:#fff;
}

.btn-primary:hover,
.btn-secondary:hover{
    transform:translateY(-2px);
}

.hero-right{
    position:relative;

    display:flex;
    justify-content:center;
}

.header-image{
    position:relative;

    width:100%;
    max-width:620px;

    border-radius:32px;
    overflow:hidden;

    box-shadow:
        0 24px 70px rgba(0,0,0,0.22);
}

.header-image img{
    width:100%;
    height:430px;

    object-fit:cover;
    display:block;
}

.header-image::after{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.05)
    );
}

.logo-wrap{
    position:absolute;

    right:-18px;
    bottom:-28px;

    width:110px;
    height:110px;

    border-radius:50%;

    background:#fff;

    padding:14px;

    border:5px solid rgba(255,255,255,0.65);

    box-shadow:
        0 14px 35px rgba(0,0,0,0.25);

    z-index:5;
}

.logo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.hero::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-220px;
    left:-120px;

    filter:blur(10px);
}


/* MENU BUTTON */
.menu-toggle{
    position: fixed;

    top: 20px;
    left: 20px;

    width: 52px;
    height: 52px;

    border: none;
    border-radius: 14px;

    background: rgba(255,255,255,0.16);

    backdrop-filter: blur(14px);

    color: #fff;
    font-size: 22px;

    cursor: pointer;

    z-index: 9999;

    box-shadow:
        0 8px 24px rgba(0,0,0,0.18);
}
/* MENU */
.side-menu{
    position:fixed;

    top:0;
    left:-100%;

    width:280px;
    max-width:85%;

    height:100vh;

    background:#fff;

    z-index:99999;

    transition:0.32s ease;

    overflow-y:auto;

    box-shadow:
        0 0 30px rgba(0,0,0,0.18);
}

.side-menu.active{
    left:0;
}

/* overlay */
.menu-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.45);

    opacity:0;
    visibility:hidden;

    transition:0.25s ease;

    z-index:99990;
}

.menu-overlay.active{
    opacity:1;
    visibility:visible;
}
/* HEADER */
.menu-header{
    display:flex;
    align-items:center;
    gap:14px;

    margin-bottom:30px;
}

.menu-header img{
    width:52px;
    height:52px;
    object-fit:contain;
}

.menu-header h3{
    font-size:20px;
    color:#222;
}

/* LINKS */
.side-menu a{
    display:block;

    padding:14px 16px;

    border-radius:12px;

    text-decoration:none;

    color:#333;
    font-weight:600;

    margin-bottom:10px;

    transition:0.25s ease;
}

.side-menu a:hover{
    background:#f4f7fb;
    transform:translateX(4px);
}

/* OVERLAY */
.menu-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.4);

    opacity:0;
    visibility:hidden;

    transition:0.3s ease;

    z-index:9990;
}

.site-contact{
  position:absolute;

  right:120px;
  bottom:10px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  max-width:320px;

  color:#fff;

  z-index:5;

  text-align:right;
}

.site-name{
  font-size:20px;
  font-weight:700;
  line-height:1.2;
}

.site-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:13px;
  opacity:.9;
}

.menu-overlay.active{
    opacity:1;
    visibility:visible;
}



/* FIX GLOBAL */
body{
  overflow-x:hidden;
}

/* FIX MOBILE */
@media (max-width:768px){

  .hero{
    padding:90px 18px 50px;
  }

  .hero-content{
    grid-template-columns:1fr;
    gap:28px;
  }

  .hero-left h1{
    font-size:34px;
    line-height:1.15;
    letter-spacing:-0.5px;
  }

  .hero-left p{
    font-size:15px;
    line-height:1.7;
  }

  .header-image{
    height:260px;

    border-radius:24px;

    clip-path:polygon(
      0 0,
      100% 0,
      100% 92%,
      86% 100%,
      0 100%
    );
}

.header-image img{
    transform:scale(1.08);
    object-position:center;
}

  .logo-wrap{
    width:78px;
    height:78px;

    right:10px;
    bottom:-18px;

    padding:10px;
  }

  /* CONTACT INFO */
.site-contact{
  position:absolute;

  left:14px;
  right:14px;
  bottom:90px;

  max-width:none;

  text-align:left;
}

  .site-name{
    font-size:18px;
  }

  .site-meta{
    flex-direction:column;
    gap:6px;
    font-size:13px;
  }

  .site-meta span{
    word-break:break-word;
  }

  /* BUTTONS */
  .cta{
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }

  /* CARD */
  .card{
    padding:20px;
    border-radius:14px;
  }

  .container{
    padding:22px 14px;
  }

  /* MENU */
  .side-menu{
    width:82%;
  }

  .menu-toggle{
    top:14px;
    left:14px;

    width:48px;
    height:48px;

    font-size:20px;
  }

  .hospital-top{
    flex-direction:column;
    align-items:flex-start;
  }

  .exam-tags span{
    font-size:13px;
  }

}
 body{
  font-family:"Montserrat",sans-serif;
}   
  </style>

</head>

<body>

  <div id="app"></div>

  <footer>
    © 2026 - Thông tin sức khỏe cộng đồng
  </footer>
<script src="./data.js?v=2"></script>

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const id =
      params.get("id");

    const disease =
      diseases.find(
        x => x.id === id
      );

    if(!disease){

      document
        .getElementById("app")
        .innerHTML = `

          <div class="container">

            <div class="card">

              <h1>
                Không tìm thấy dữ liệu
              </h1>

            </div>

          </div>

        `;

      throw new Error(
        "Disease not found"
      );
    }
    

    document.title =
      disease.seoTitle;

    document
      .getElementById("meta-desc")
      .setAttribute(
        "content",
        disease.seoDescription
      );

    document
      .getElementById("app")
      .innerHTML = `

      <section
        class="hero"
        style="
          background:
          linear-gradient(
            135deg,
            ${disease.hero.color1},
            ${disease.hero.color2}
          );
        "
      >

    <div class="hero-content">

    <!-- LEFT -->
    <div class="hero-left">



<!-- BUTTON -->
<button class="menu-toggle" id="menuToggle">
    ☰
</button>

<!-- MENU -->
<div class="side-menu" id="sideMenu">

    <div class="menu-header">
        <img src="./logo-bv-new.png" alt="">
        <h3>Danh mục bệnh</h3>
    </div>

    <div id="menuList"></div>

</div>

<!-- OVERLAY -->
<div class="menu-overlay" id="menuOverlay"></div>



        
    <!-- RIGHT -->
    <div class="hero-right">

  </div>
</div>
        <div class="header-image">

            <img
                src="./header.jpg"
                alt="Header"
            >

        </div>

        <div class="logo-wrap">

            <img
                src="./logo-bv-new.png"
                alt="Logo"
            >

        </div>

    </div>

</div>
<div class="container">
<div class="badge">

        </div>

        <h1>
            ${disease.title}
        </h1>

        <p>
            ${disease.hero.desc}
        </p>

        <div class="cta">

            <a

            </a>

            <a
                href="#xu-tri"
                class="btn btn-secondary"
            >

            </a>

        </div>

    </div>
</div>
      <div class="container">

        <div class="card">

          <h2>

            ${disease.overview.title}

          </h2>

          <p>

            ${disease.overview.content}

          </p>

          <div class="info-box">

            ${disease.overview.info}

          </div>

        </div>

        <div
          class="card"
          id="nhan-biet"
        >

          <h2>

            ${disease.symptoms.title}

          </h2>

          <div class="grid">

            ${disease.symptoms.items.map(item => `

              <div class="symptom">

                <h3>

                <p>
                  ${item.desc}
                </p>

              </div>

            `).join("")}

          </div>

          <div class="warning">

            <strong>
              Lưu ý:
            </strong>

            ${disease.symptoms.warning}

          </div>

        </div>

        <div
          class="card"
          id="xu-tri"
        >

          <h2>

          </h2>

          <div class="steps">

            ${disease.emergency.items.map(item => `

              <div class="step">

                <h3>
                  ${item.title}
                </h3>

                <p>
                  ${item.desc}
                </p>

              </div>

            `).join("")}

          </div>

        </div>

        <div class="card">

          <h2>

            ${disease.risks.title}

          </h2>

          <ul>

            ${disease.risks.items.map(item => `

              <li>${item}</li>

            `).join("")}

          </ul>

        </div>

  <h2>
    ${disease.hospitalSuggestion.title}
  </h2>

  ${disease.hospitalSuggestion.items.map(item => `

const menuList =
document.getElementById("menuList");

menuList.innerHTML = diseases.map(item => `

    <a href="./item.html?id=${item.id}">
        ${item.title}
    </a>

`).join("");
  </script>
<script src="./data.js?v=3"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const menuToggle =
        document.getElementById("menuToggle");

        const sideMenu =
        document.getElementById("sideMenu");

        const menuOverlay =
        document.getElementById("menuOverlay");

        const menuList =
        document.getElementById("menuList");

        /* render menu */
        menuList.innerHTML =
        diseases.map(item => `

            <a href="./item.html?id=${item.id}">
                ${item.title}
            </a>

        `).join("");

        /* open */
        menuToggle.onclick = () => {

            sideMenu.classList.add("active");

            menuOverlay.classList.add("active");

        };

        /* close */
        menuOverlay.onclick = () => {

            sideMenu.classList.remove("active");

            menuOverlay.classList.remove("active");

        };

    }
);

</script>
</body>
</html>
